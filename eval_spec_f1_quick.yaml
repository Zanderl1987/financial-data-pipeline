# Evaluation specification for financial-data-pipeline F1 quick test
# Run with: python -m evaluation.runner_yaml eval_spec_f1_quick.yaml

version: 1
description: "F1 quick test: momentum signal with capital-constrained compounding"
created_at: "2026-09-12T00:00:00"

signal:
  name: "momentum_f1_quick"
  source: "signal-panel"
  factor: "momentum"
  lag_days: 1
  direction: 1

universe:
  symbols: ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN", "META", "TSLA", "JPM", "V", "JNJ"]
  exclude_otc: true
  min_dollar_volume: null
  sp500_only: false

evaluation:
  benchmark: "SPY"
  price_table: null
  quantiles: 5
  rebalance: "M"
  long_short: true
  n_boot: 100
  n_perm: 50
  seed: 42

advanced:
  meta_label: false
  meta_threshold: 0.5
  meta_min_train: 50
  meta_refit_every: 20
  meta_l2: 1.0
  regime_report: false
  regime_benchmark: "SPY"
  regime_k: 2
  tax: false
  robustness: false
  robustness_n_trials: 100
  robustness_sigma_bps: 5.0
  robustness_alpha: 0.95

portfolio:
  cost_bps: 1.0
  spread_bps: 0.5
  borrow_fee_bps: 0.0
  slippage_model: "sqrt"
  adv_impact_coeff: 0.1
  adv_participation_coeff: null
  aum: 1000000.0
  adv_window: 20
  vol_target: null
  max_weight: null
  max_drawdown_stop: null
  weighting_mode: "quantile"
  hrp_lookback: 126
  hrp_linkage_method: "single"

capital_constrained:  # F1: capital-constrained compounding
  enabled: true
  initial_capital: 1000000.0
  max_leverage: 1.0
  max_position_pct: 0.20
  max_sector_pct: 0.30
  compound_returns: true
  rebalance_on_capital_change: true
  capital_change_threshold_pct: 5.0

price_volume:  # F1: price-volume signal family
  enabled: false

output:
  out_root: "storage/reports/eval"
  registry_path: null
  write_registry: true
  write_artifacts: true